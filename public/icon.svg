<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#grad)"/>
  
  <!-- Graduation Cap & Book Motif -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Cap top -->
    <path d="M256 120 L400 185 L256 250 L112 185 Z"/>
    <!-- Tassel -->
    <path d="M365 205 L365 270 Q365 285 375 295 L370 305 Q355 285 355 270 L355 200 Z" fill="#fde047"/>
    <circle cx="360" cy="305" r="8" fill="#fde047"/>
    <!-- Skull cap bottom -->
    <path d="M165 220 L165 290 Q256 345 347 290 L347 220 Q256 270 165 220 Z" opacity="0.9"/>
    
    <!-- Open Book -->
    <path d="M140 340 Q256 320 256 360 Q256 320 372 340 L372 400 Q256 380 256 420 Q256 380 140 400 Z" fill="#ffffff"/>
    <path d="M254 360 L254 420 L258 420 L258 360 Z" fill="#047857"/>
  </g>
</svg>
